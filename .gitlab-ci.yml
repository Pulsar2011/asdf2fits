# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- .pre
- build
- test
- secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'
  GIT_SUBMODULE_STRATEGY: normal
  DEBIAN_FRONTEND: noninteractive
  GIT_DEPTH: "0"
  # Compilers are named explicitly: left to itself, CMake takes /usr/bin/cc and c++, which are GCC 14.
  # Every job that configures must install clang, and llvm for llvm-ar, used by the link-time
  # optimisation of the release build. For GCC 14, set CC: gcc and CXX: g++.
  CC: clang
  CXX: clang++
  # Packages of the build, of the DeepSky libraries it needs (deps job) and of its tests
  BUILD_PACKAGES: "cmake clang llvm libgsl-dev qt6-base-dev gnuplot-nox libcairo2 libpango-1.0-0 libpangocairo-1.0-0"

# Extended by each job rather than set globally: secret_detection has its own image, without apt-get.
.debian:
  image:
    name: buildpack-deps:trixie
  variables:
    DEBIAN_FRONTEND: noninteractive
    GIT_SUBMODULE_STRATEGY: normal
    # libfyaml takes its version from the git tags of its submodule, which a shallow clone doesn't have.
    GIT_DEPTH: "0"
    CC: clang
    CXX: clang++
  before_script:
    - apt-get update
    - apt-get install -y cmake make git patch clang llvm gdb
    - apt-get install -y build-essential pkg-config autoconf automake libtool ca-certificates
    # DeepSkyFits
    - apt-get install -y libgsl-dev
    # libasdf
    - apt-get install -y liblz4-dev zlib1g-dev libbz2-dev 

# DEEPSKYFITS_TOKEN: CI/CD variable of this project or its group, with read access to deepskyfits.
deps:
  extends: .debian
  stage: .pre
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - |
      set -e
      export DeepSkyROOT=$(pwd)/deepskyproject
      mkdir -p "$DeepSkyROOT"
      # Builds and installs one DeepSky library into DeepSkyROOT: out of source with the CMake
      # presets when the repository has them, with its former in-source commands otherwise.
      install_deepsky() {
        git clone --recurse-submodules "https://oauth2:${DEEPSKYFITS_TOKEN}@gitlab.in2p3.fr/deepskyproject/$1.git"
        cd "$1"
        if [ -f CMakePresets.json ]; then
          cmake --preset default -DCMAKE_INSTALL_PREFIX="$DeepSkyROOT" -DBUILD_TESTS=OFF
          cmake --build build --parallel 2 --target install
        else
          cmake -DCMAKE_INSTALL_PREFIX="$DeepSkyROOT" -Wno-dev .
          make -j 2
          # The former deepskyfits CMakeLists needs a second configure to list the submodule headers
          cmake -DCMAKE_INSTALL_PREFIX="$DeepSkyROOT" -Wno-dev .
          make -j 2 install
        fi
        cd ..
      }
      install_deepsky deepskyfits
  artifacts:
    expire_in: 24 hrs
    paths:
      - deepskyproject/

build:
  extends: .debian
  stage: build
  needs:
    - job: deps
      artifacts: true
  script:
    - export DeepSkyROOT=$(pwd)/deepskyproject
    # libDSTfits finds libMinuit2 through this, and the build runs the test program to list its tests.
    - export LD_LIBRARY_PATH=${DeepSkyROOT}/lib
    - cmake -S . -B build -Wno-dev
    - cmake --build build -j 2
  artifacts:
    expire_in: 2 hrs
    paths:
      - build/
    exclude:
      - build/external/**

# Still needs the submodules: the tests read the fixtures of libasdf from the source tree.
test:
  extends: .debian
  stage: test
  needs:
    - job: build
      artifacts: true
    - job: deps
      artifacts: true
  script:
    - export LD_LIBRARY_PATH=$(pwd)/deepskyproject/lib
    - cd build
    - ctest --output-on-failure

secret_detection:
  stage: secret-detection
  # Runs even if the build or the tests fail.
  needs: []

include:
- template: Security/Secret-Detection.gitlab-ci.yml
